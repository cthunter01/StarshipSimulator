# Builds and tests the CI presets on Linux, macOS and Windows, and checks formatting.
# Linux runs in an Arch Linux container so CI has the same current GCC/Clang as the dev machine.
# The unit tests need only the core and physics libraries, and the sky data is not downloaded (CI is
# set). The app is built everywhere, but only the macOS runners have a GPU to run it on (Metal).
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, asan, tidy]
    steps:
      - name: Install toolchain and libraries
        # sdl3: window/input/GPU API, glm: math, shaderc: glslc (GLSL -> SPIR-V at build time).
        run: pacman -Syu --noconfirm --needed cmake ninja clang git sdl3 glm shaderc
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Apple Clang from the runner's default Xcode.
  # No asan here: the Linux asan job sanitizes the same code, and Linux also has leak detection, which Apple's
  # AddressSanitizer runtime lacks. The asan preset itself still works on a Mac for local use.
  macos:
    name: macos / ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - name: Install Ninja and libraries
        # shaderc: glslc. SDL3 and GLM are used from Homebrew when its versions are new enough,
        # otherwise built from source (cmake/Dependencies.cmake).
        run: brew install ninja shaderc sdl3 glm
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      # The runners have a Metal GPU, so the app itself runs here: a few pictures with Metal's API
      # validation on, which fails the job on any misuse. They are kept with the run to look at.
      - name: Render with Metal
        shell: bash
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          app=build/${{ matrix.preset }}/bin/StarshipSimulator
          $app --size 960x540 --view town --capture metal-town.png --capture-ui 2>&1 | tee metal-town.log
          $app --size 960x540 --view valley --capture metal-valley.png 2>&1 | tee metal-valley.log
          presets=build/${{ matrix.preset }}/bin/data/presets
          $app --size 960x540 --view valley --scenario $presets/kalpana_one.toml \
            --capture metal-kalpana.png 2>&1 | tee metal-kalpana.log
          $app --size 960x540 --view lookup --scenario $presets/island_one.toml \
            --capture metal-island-one-lookup.png 2>&1 | tee metal-island-one-lookup.log
          $app --size 960x540 --view pole --scenario $presets/island_one.toml \
            --capture metal-island-one-pole.png 2>&1 | tee metal-island-one-pole.log
          $app --size 960x540 --view valley --scenario $presets/stanford_torus.toml \
            --capture metal-torus-valley.png 2>&1 | tee metal-torus-valley.log
          $app --size 960x540 --view spoke --scenario $presets/stanford_torus.toml \
            --capture metal-torus-spoke.png 2>&1 | tee metal-torus-spoke.log
          for picture in town valley kalpana island-one-lookup island-one-pole torus-valley \
            torus-spoke; do
            test -s metal-$picture.png
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-pictures
          path: |
            metal-*.png
            metal-*.log

  # MSVC from the runner's Visual Studio; msvc-dev-cmd sets up the Developer PowerShell environment.
  # SDL3, GLM, toml++ and GoogleTest are built from source; glslc comes with the Vulkan SDK.
  windows:
    name: windows / ci-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install the Vulkan SDK (glslc)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Configure, build and test
        run: cmake --workflow --preset ci-msvc

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
