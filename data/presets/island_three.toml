# StarshipSimulator habitat scenario
format_version = 1
generator_version = 4
title = "Island Three"
description = "Gerard O'Neill's Island Three (1976): an 8 km wide, 32 km long cylinder spinning once every two minutes for Earth gravity, with three valleys lit by three mirrors."

# Spin axis +Z points at the Sun. Gravity comes from spin: omega^2 * radius.
[habitat]
type = "oneill_cylinder"
radius_m = 4000.0
length_m = 32000.0
surface_gravity_g = 1.0
strip_pairs = 3
window_fraction = 0.5
population_density_per_km2 = 5000.0

[habitat.sunward_endcap]
shape = "hemisphere"

[habitat.antisunward_endcap]
shape = "conical_ramp"
ramp_slope_deg = 25.0
ramp_top_radius_fraction = 0.5
upper_slope_deg = 35.0
hub_radius_m = 60.0

# 45 degrees puts the sun overhead; 90 is sunset.
[habitat.mirrors]
opening_angle_deg = 60.0
reflectivity = 0.9

# The counter-rotating partner cylinder, alongside (axis to axis).
[habitat.partner]
enabled = true
separation_m = 80000.0

[habitat.atmosphere]
surface_pressure_kpa = 101.325
temperature_k = 293.0

[habitat.terrain]
seed = 1975
hill_height_m = 40.0
mountain_height_m = 120.0
feature_size_m = 800.0
river_width_m = 40.0
lakes_per_valley = 2
lake_radius_m = 300.0
forest_cover = 0.35

# Villages along the rivers and farmsteads in the fields.
[habitat.settlements]
towns_per_valley = 4
town_radius_m = 260.0
farms_per_valley = 14

[start]
valley = 1
z_m = -2000.0
heading_deg = 0.0

# Where the habitat is and when the visit begins (UTC).
# Locations: earth_moon_l4, earth_moon_l5, sun_earth_l4, sun_earth_l5, sun_mars_l4, sun_mars_l5
[sky]
location = "earth_moon_l5"
start = "2045-06-15T09:00:00Z"
utc_offset_hours = 0.0

# The mirrors' daily swing (local time): 90 degrees at sunrise and sunset.
[day]
enabled = true
day_length_hours = 14.0
sunrise_hour = 6.0
noon_angle_deg = 45.0
night_angle_deg = 105.0

# Weather: the cloud deck over the valleys, how often it rains, and the year.
[climate]
cloud_base_m = 420.0
cloud_top_m = 820.0
cloudiness = 0.45
raininess = 0.35
wind_speed_ms = 3.0
mistiness = 0.7
year_days = 120.0
season_swing_hours = 2.0
season_at_epoch = 0.851  # so the preset starts in early summer
