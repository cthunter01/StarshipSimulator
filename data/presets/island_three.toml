# StarshipSimulator habitat scenario
format_version = 1
generator_version = 1
title = "Island Three"
description = "Gerard O'Neill's Island Three (1976): an 8 km wide, 32 km long cylinder spinning once every two minutes for Earth gravity, with three valleys lit by three mirrors."

# Spin axis +Z points at the Sun. Gravity comes from spin: omega^2 * radius.
[habitat]
type = "oneill_cylinder"
radius_m = 4000.0
length_m = 32000.0
surface_gravity_g = 1.0
strip_pairs = 3
window_fraction = 0.5
population_density_per_km2 = 5000.0

[habitat.sunward_endcap]
shape = "hemisphere"

[habitat.antisunward_endcap]
shape = "conical_ramp"
ramp_slope_deg = 25.0
ramp_top_radius_fraction = 0.5
upper_slope_deg = 35.0
hub_radius_m = 60.0

# 45 degrees puts the sun overhead; 90 is sunset.
[habitat.mirrors]
opening_angle_deg = 60.0
reflectivity = 0.9

[habitat.atmosphere]
surface_pressure_kpa = 101.325
temperature_k = 293.0

[habitat.terrain]
seed = 1975
hill_height_m = 40.0
mountain_height_m = 120.0
feature_size_m = 800.0

[start]
valley = 1
z_m = -2000.0
heading_deg = 0.0
