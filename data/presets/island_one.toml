# StarshipSimulator habitat scenario
format_version = 1
generator_version = 6
title = "Island One"
description = "A sphere 500 m across turning at 1.9 rpm, O'Neill's first design for ten thousand people (1975-76). A belt of land 300 m wide runs round the equator, 1.6 km round, and the ground climbs toward the poles on either hand; the polar caps are glass, and mirrors outside them throw the sunlight in."

# The axis points at the Sun. Mirrors outside each polar window fold the light in over the pole, never
# lower than half the window's latitude, or the valley floor would go dark; shutters close them at night.
[habitat]
type = "bernal_sphere"
radius_m = 250.0
surface_gravity_g = 1.0
population_density_per_km2 = 22200.0

# The band of land around the equator, and the windows at the poles.
[habitat.sphere]
land_latitude_deg = 35.0
window_latitude_deg = 55.0

# The day schedule sets how far the shutters open: 45 degrees is full day, 90 dusk.
[habitat.mirrors]
opening_angle_deg = 50.0
reflectivity = 0.9

[habitat.atmosphere]
surface_pressure_kpa = 101.325
temperature_k = 293.0

[habitat.terrain]
seed = 17
hill_height_m = 3.0
mountain_height_m = 6.0
feature_size_m = 60.0
river_width_m = 7.0
lakes_per_valley = 2
lake_radius_m = 25.0
forest_cover = 0.3

# Villages beside the river on the lower slopes, farms above them, all the way round.
[habitat.settlements]
towns_per_valley = 3
town_radius_m = 70.0
farms_per_valley = 6

# Where the visit begins: on the equator, along the band (round the axis) and across it.
[start]
band = 0
along_m = 0.0
across_m = 0.0
heading_deg = 0.0

# Where the habitat is and when the visit begins (UTC).
# Locations: earth_moon_l4, earth_moon_l5, sun_earth_l4, sun_earth_l5, sun_mars_l4, sun_mars_l5
[sky]
location = "earth_moon_l5"
start = "2045-06-15T09:00:00Z"
utc_offset_hours = 0.0

# The shutters' daily swing (local time): 90 degrees at sunrise and sunset.
[day]
enabled = true
day_length_hours = 14.0
sunrise_hour = 6.0
noon_angle_deg = 45.0
night_angle_deg = 105.0

# Weather: a low deck of cloud, as in any habitat this small.
[climate]
cloud_base_m = 95.0
cloud_top_m = 150.0
cloudiness = 0.35
raininess = 0.3
wind_speed_ms = 2.0
mistiness = 0.5
year_days = 40.0
season_swing_hours = 1.5
season_at_epoch = 0.153  # so the preset starts in early summer
